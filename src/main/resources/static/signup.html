<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your workspace · TaskFlow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/landing.css"><script src="/auth.js" defer></script></head>
<body class="auth-page"><header class="nav"><a class="brand" href="/"><span class="brand-mark">t</span> taskflow</a><a class="nav-login" href="/login.html">Log in</a></header><main class="auth-wrap"><a class="back-link" href="/">← Back to TaskFlow</a><section class="auth-card"><p class="eyebrow">A FRESH START</p><h1>Create your workspace</h1><p class="auth-subtitle">Tell us a little about yourself so we can set up your dashboard.</p><form id="signupForm"><label>Your name<input id="signupName" type="text" maxlength="100" autocomplete="name" required></label><label>Email<input id="signupEmail" type="email" maxlength="190" autocomplete="email" required></label><label>Password<input id="signupPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><small>Use at least 8 characters.</small></label><label>Which best describes you?<select id="signupProfile" required><option value="" selected disabled>Choose a profile</option><option value="PERSONAL">General personal user</option><option value="STUDENT">Student</option><option value="OFFICE_WORKER">Office worker</option><option value="FREELANCER">Freelancer</option><option value="BUSINESS_OWNER">Business owner</option><option value="TEACHER">Teacher</option></select></label><p class="form-error" id="signupError" role="alert"></p><button class="button auth-submit" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p></section></main></body></html>
